function rnode(n,x,y){
  const t=NODE_TYPES[n.type];
  if(n.type!=="water"){ctx.fillStyle="rgba(0,0,0,.14)";ctx.beginPath();ctx.ellipse(x,y+(n.type==="tree"?13:n.r*0.6),n.r*0.85,Math.max(3,n.r*0.32),0,0,7);ctx.fill();}
  if(n.type==="tree"){ // teak (ต้นสัก) — tall straight hardwood, layered canopy
    ctx.fillStyle=t.trunk;ctx.fillRect(x-3,y-2,6,16);
    ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(x,y-6,n.r,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x-n.r*0.5,y-2,n.r*0.6,0,7);ctx.arc(x+n.r*0.5,y-2,n.r*0.6,0,7);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.10)";ctx.beginPath();ctx.arc(x-4,y-10,n.r*0.45,0,7);ctx.fill();}
  else if(n.type==="water"){ctx.fillStyle=t.color;ctx.beginPath();ctx.ellipse(x,y,n.r,n.r*0.7,0,0,7);ctx.fill();ctx.fillStyle="rgba(255,255,255,.18)";ctx.beginPath();ctx.ellipse(x-4,y-3,n.r*0.4,n.r*0.25,0,0,7);ctx.fill();}
  else if(n.type==="bush"){ // banana plant (ต้นกล้วย)
    ctx.fillStyle="#6b7d3a";ctx.fillRect(x-2,y-2,4,10);
    ctx.fillStyle=t.color;
    for(const a of [-1.1,-0.4,0.4,1.1,Math.PI]){ctx.save();ctx.translate(x,y-6);ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,-n.r*0.7,n.r*0.34,n.r*0.95,0,0,7);ctx.fill();ctx.restore();}
    ctx.fillStyle="#e8c44a";for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(x+2+i*2,y+2,1.6,4,-0.5,0,7);ctx.fill();}}
  else if(n.type==="herb"||n.type==="reed"){ // Thai herb / krathin (กระถิน) clumps
    ctx.strokeStyle=t.color;ctx.lineWidth=2;ctx.lineCap="round";
    for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(x,y+3);ctx.quadraticCurveTo(x+i*3,y-n.r*0.6,x+i*5,y-n.r*1.1);ctx.stroke();}
    if(n.type==="herb"){ctx.fillStyle="#e58fb0";ctx.beginPath();ctx.arc(x,y-n.r*0.8,2,0,7);ctx.fill();}
    ctx.lineCap="butt";}
  else{ // rock / iron / copper / sand
    ctx.fillStyle=t.color;ctx.beginPath();
    ctx.moveTo(x-n.r,y+n.r*0.5);ctx.lineTo(x-n.r*0.5,y-n.r*0.6);ctx.lineTo(x+n.r*0.4,y-n.r*0.7);ctx.lineTo(x+n.r,y+n.r*0.4);ctx.lineTo(x+n.r*0.5,y+n.r*0.8);ctx.closePath();ctx.fill();
    if(t.spec){ctx.fillStyle=t.spec;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(x-6+i*4,y-4+(i%2)*6,2,0,7);ctx.fill();}}
  }
  // damage bar
  if(n.hp<n.maxhp&&!t.infinite){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(x-14,y-n.r-12,28,4);ctx.fillStyle="#e0962e";ctx.fillRect(x-14,y-n.r-12,28*(n.hp/n.maxhp),4);}
}
function bambooWall(x,y,door){
  const poles=4,gap=40/poles;
  for(let i=0;i<poles;i++){
    const px=x-20+gap*i+gap/2,pw=gap*0.74;
    ctx.fillStyle=door?"#c6b86e":"#9fae53";ctx.fillRect(px-pw/2,y-20,pw,40);
    ctx.fillStyle="rgba(255,255,255,.16)";ctx.fillRect(px-pw/2+1,y-20,1.5,40);
    ctx.fillStyle="rgba(0,0,0,.18)";ctx.fillRect(px+pw/2-1.5,y-20,1.5,40);
    ctx.strokeStyle="#6f7d35";ctx.lineWidth=1.3;
    for(let yy=-13;yy<20;yy+=12){ctx.beginPath();ctx.moveTo(px-pw/2,y+yy);ctx.lineTo(px+pw/2,y+yy);ctx.stroke();}
  }
  ctx.strokeStyle="#7a5a30";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-19,y-6);ctx.lineTo(x+19,y-5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-19,y+9);ctx.lineTo(x+19,y+10);ctx.stroke();
}
function rbuild(b,x,y){
  if(b.type==="wall"||b.type==="door"){ctx.fillStyle="rgba(0,0,0,.18)";ctx.beginPath();ctx.ellipse(x,y+18,19,5,0,0,7);ctx.fill();}
  if(b.type==="wall"){bambooWall(x,y,false);}
  else if(b.type==="door"){ctx.globalAlpha=b.open?0.4:1;bambooWall(x,y,true);ctx.globalAlpha=1;if(!b.open){ctx.fillStyle="#e0962e";ctx.beginPath();ctx.arc(x+12,y,2.5,0,7);ctx.fill();}}
  else if(b.type==="box"){ctx.fillStyle="#8a6a3a";ctx.fillRect(x-13,y-11,26,22);ctx.strokeStyle="#5b4326";ctx.strokeRect(x-13,y-11,26,22);ctx.fillStyle="#5b4326";ctx.fillRect(x-13,y-3,26,3);}
  else if(b.type==="furnace"){ctx.fillStyle="#574c44";ctx.fillRect(x-15,y-16,30,30);ctx.fillStyle="#e0962e";ctx.fillRect(x-7,y-2,14,12);ctx.fillStyle="#ffd27a";ctx.fillRect(x-4,y+2,8,8);}
  else if(b.type==="table"){ctx.fillStyle="#8a6a3a";ctx.fillRect(x-16,y-12,32,18);ctx.strokeStyle="#5b4326";ctx.strokeRect(x-16,y-12,32,18);
    ctx.fillStyle="#5b4326";ctx.fillRect(x-14,y+6,3,8);ctx.fillRect(x+11,y+6,3,8);
    ctx.fillStyle="#9aa4ab";ctx.fillRect(x-10,y-9,5,5);ctx.fillStyle="#6b4a26";ctx.fillRect(x+3,y-9,8,3);
    if((b.tier||1)>=2){ctx.fillStyle="#e0962e";ctx.font="bold 9px sans-serif";ctx.textAlign="center";ctx.fillText("Lv2",x,y-15);ctx.textAlign="left";}}
  else if(b.type==="turret"){
    ctx.fillStyle="#4a4034";ctx.beginPath();ctx.arc(x,y,12,0,7);ctx.fill();
    ctx.strokeStyle="#2a241c";ctx.lineWidth=2;ctx.stroke();
    const a=b.angle||0;const empty=(b.ammo||0)<=0;
    ctx.save();ctx.translate(x,y-2);ctx.rotate(a);
    ctx.fillStyle=empty?"#6b3030":"#2e2a26";ctx.fillRect(0,-3,20,6); // barrel
    ctx.fillStyle="#5a5048";ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
    ctx.restore();
    // ammo readout
    ctx.fillStyle=empty?"#c4452f":"#e8d9b0";ctx.font="9px sans-serif";ctx.textAlign="center";
    ctx.fillText(empty?"ไม่มีกระสุน":("🔸"+(b.ammo||0)),x,y-16);ctx.textAlign="left";}
}
function rloot(l,x,y){
  if(l.arrow){ // landed arrow — small marker
    ctx.fillStyle="#e8d9b0";ctx.font="12px sans-serif";ctx.textAlign="center";ctx.fillText("🪶",x,y+4);ctx.textAlign="left";return;
  }
  const pulse=0.6+0.4*Math.sin(now()/250);
  ctx.fillStyle=l.corpse?`rgba(196,69,47,${pulse})`:`rgba(224,150,46,${pulse})`;
  ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();
  ctx.fillStyle="#1d1a14";ctx.font="11px sans-serif";ctx.textAlign="center";ctx.fillText(l.corpse?"💀":"🎒",x,y+4);ctx.textAlign="left";
}
function rwolf(w,x,y){
  const m=MOB_TYPES[w.kind]||MOB_TYPES.deer;
  const fx=(w.x>G.player.x?-1:1); // face player-ish (+1 => facing right)
  const hurt=w.dmgT>0;
  const body=hurt?"#ffb3a7":(w.state==="chase"?m.colChase:m.col);
  ctx.save();ctx.translate(x,y);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(0,m.r*0.7,m.r*0.95,m.r*0.35,0,0,7);ctx.fill();
  if(w.kind==="deer"){
    ctx.strokeStyle="#7a5230";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,4);ctx.lineTo(-6,11);ctx.moveTo(6,4);ctx.lineTo(6,11);ctx.stroke();
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,m.r,m.r*0.6,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(m.r*0.7*fx,-6,4,6,0,0,7);ctx.fill(); // neck
    ctx.beginPath();ctx.arc(m.r*0.95*fx,-11,4,0,7);ctx.fill(); // head
    ctx.strokeStyle="#caa46a";ctx.lineWidth=1.4;ctx.beginPath();
    ctx.moveTo(m.r*0.95*fx,-14);ctx.lineTo(m.r*0.78*fx,-22);ctx.moveTo(m.r*0.95*fx,-14);ctx.lineTo(m.r*1.15*fx,-21);ctx.stroke(); // antlers
    ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.arc(-3,-2,1.4,0,7);ctx.arc(3,2,1.4,0,7);ctx.fill();
    ctx.fillStyle="#e8dcc6";ctx.beginPath();ctx.arc(-m.r*0.95*fx,-2,2,0,7);ctx.fill(); // tail
  }else if(w.kind==="buffalo"){
    if(w.mode==="telegraph"){ctx.strokeStyle="#c4452f";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,m.r+5+Math.sin(now()/40)*2,0,7);ctx.stroke();}
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,m.r,m.r*0.74,0,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(m.r*0.85*fx,0,7,0,7);ctx.fill(); // head
    ctx.strokeStyle="#d4c8ac";ctx.lineWidth=2.6;ctx.lineCap="round"; // sweeping horns
    ctx.beginPath();ctx.arc(m.r*0.85*fx,-5,8,Math.PI*0.15,Math.PI*0.85);ctx.stroke();ctx.lineCap="butt";
    ctx.fillStyle="#15100c";ctx.beginPath();ctx.arc(m.r*1.05*fx,0,1.6,0,7);ctx.fill();
  }else if(w.kind==="tiger"){
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,m.r,m.r*0.64,0,0,7);ctx.fill();
    ctx.strokeStyle="rgba(30,18,8,.8)";ctx.lineWidth=1.6;
    for(let i=-1;i<=2;i++){ctx.beginPath();ctx.moveTo(i*5,-m.r*0.5);ctx.lineTo(i*5,m.r*0.5);ctx.stroke();}
    ctx.fillStyle=body;ctx.beginPath();ctx.arc(m.r*0.9*fx,-2,5.5,0,7);ctx.fill(); // head
    ctx.beginPath();ctx.arc(m.r*0.72*fx,-m.r*0.55,2.4,0,7);ctx.arc(m.r*1.08*fx,-m.r*0.55,2.4,0,7);ctx.fill(); // ears
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(m.r*0.95*fx,1,2.4,0,7);ctx.fill(); // muzzle
    ctx.fillStyle="#15100c";ctx.beginPath();ctx.arc(m.r*1.0*fx,-3,1.4,0,7);ctx.fill();
  }else{ // elephant
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,0,m.r,m.r*0.78,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(m.r*0.45*fx,-2,7,9,0,0,7);ctx.fill(); // ear
    ctx.beginPath();ctx.arc(m.r*0.95*fx,0,8,0,7);ctx.fill(); // head
    ctx.strokeStyle=body;ctx.lineWidth=5;ctx.lineCap="round"; // trunk
    ctx.beginPath();ctx.moveTo(m.r*1.1*fx,2);ctx.quadraticCurveTo(m.r*1.5*fx,7,m.r*1.4*fx,14);ctx.stroke();ctx.lineCap="butt";
    ctx.strokeStyle="#efe6cf";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m.r*1.05*fx,5);ctx.lineTo(m.r*1.3*fx,11);ctx.stroke(); // tusk
    ctx.fillStyle="#15100c";ctx.beginPath();ctx.arc(m.r*1.0*fx,-3,1.6,0,7);ctx.fill();
  }
  ctx.restore();
  if(w.hp<w.maxhp){const bw=Math.max(24,m.r*2);ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(x-bw/2,y-m.r-8,bw,3);
    ctx.fillStyle=m.boss?"#e0962e":"#c4452f";ctx.fillRect(x-bw/2,y-m.r-8,bw*(w.hp/w.maxhp),3);}
}
function rbot(b,x,y){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.ellipse(0,11,8,3.5,0,0,7);ctx.fill();
  ctx.fillStyle="#3a4a63";ctx.beginPath();ctx.ellipse(-3,9,2.6,4,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(3,9,2.6,4,0,0,7);ctx.fill();
  ctx.fillStyle=b.dmgT>0?"#ffb3a7":b.col;ctx.beginPath();ctx.ellipse(0,1,7.5,8.5,0,0,7);ctx.fill();
  ctx.fillStyle="#e8c39a";ctx.beginPath();ctx.arc(2*b.dir,-8,6,0,7);ctx.fill();
  ngobHat(2*b.dir,-11); // หมวกงอบ — everyone on the island wears one
  ctx.restore();
  if(G.beacon.state==="carried"&&G.beacon.owner===b.id){ctx.font="13px sans-serif";ctx.textAlign="center";ctx.fillText("📡",x,y-22);ctx.textAlign="left";}
  ctx.fillStyle="#cdbfa3";ctx.font="8px sans-serif";ctx.textAlign="center";ctx.fillText(b.name,x,y-(G.beacon.owner===b.id&&G.beacon.state==="carried"?30:20));ctx.textAlign="left";
  if(b.hp<b.maxhp){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(x-12,y-16,24,3);ctx.fillStyle="#5fd17a";ctx.fillRect(x-12,y-16,24*(b.hp/b.maxhp),3);}
}
function headColor(id){
  if(!id)return "#b8c0c6";
  if(id.startsWith("iron_"))return "#aab2b8";
  if(id.startsWith("copper_"))return "#d98a3a";
  if(id.startsWith("stone_"))return "#c3c9ce";
  return "#b8c0c6";
}
function drawTool(g,kind,sw,col){
  // g: ctx already translated to hand pivot, facing +x; sw: swing 0..1
  col=col||"#b8c0c6";
  g.save();
  if(kind==="axe"){g.rotate(-0.5+sw*1.6);
    g.strokeStyle="#6b4a26";g.lineWidth=2.4;g.beginPath();g.moveTo(0,0);g.lineTo(13,0);g.stroke();
    g.fillStyle=col;g.beginPath();g.moveTo(11,-5);g.lineTo(17,-2);g.lineTo(17,3);g.lineTo(11,5);g.closePath();g.fill();}
  else if(kind==="pick"){g.rotate(-0.5+sw*1.6);
    g.strokeStyle="#6b4a26";g.lineWidth=2.4;g.beginPath();g.moveTo(0,0);g.lineTo(13,0);g.stroke();
    g.strokeStyle=col;g.lineWidth=2.6;g.beginPath();g.moveTo(8,-6);g.quadraticCurveTo(15,0,8,6);g.stroke();}
  else if(kind==="spear"){g.rotate(-0.2+sw*1.1);
    g.strokeStyle="#7d5a30";g.lineWidth=2.2;g.beginPath();g.moveTo(-4,0);g.lineTo(18,0);g.stroke();
    g.fillStyle=col;g.beginPath();g.moveTo(18,-3);g.lineTo(25,0);g.lineTo(18,3);g.closePath();g.fill();}
  else if(kind==="hammer"){g.rotate(-0.5+sw*1.6);
    g.strokeStyle="#6b4a26";g.lineWidth=2.4;g.beginPath();g.moveTo(0,0);g.lineTo(13,0);g.stroke();
    g.fillStyle="#8b8378";g.fillRect(11,-5,7,10);}
  else if(kind==="bow"){g.rotate(-0.1+sw*0.5);
    g.strokeStyle="#7d5a30";g.lineWidth=2;g.beginPath();g.arc(2,0,10,-1.25,1.25);g.stroke();
    g.strokeStyle="#cdbfa3";g.lineWidth=1;
    g.beginPath();g.moveTo(2+10*Math.cos(-1.25),10*Math.sin(-1.25));g.lineTo(2+10*Math.cos(1.25),10*Math.sin(1.25));g.stroke();}
  else if(kind==="gun"){const k=1-sw*0.25; // small recoil
    g.fillStyle="#2e2a26";g.fillRect(-2*k,-2,16*k,4); // barrel
    g.fillStyle="#4a4034";g.fillRect(-3,0,5,6);}      // grip
  else if(kind==="sniper"){const k=1-sw*0.2;
    g.fillStyle="#2e2a26";g.fillRect(-3*k,-1.5,24*k,3);
    g.fillStyle="#1a1714";g.fillRect(4,-4,6,2); // scope
    g.fillStyle="#4a4034";g.fillRect(-3,0,5,6);}
  g.restore();
}
// หมวกงอบ — Thai conical farmer hat (drawn in the actor's local space, facing +x)
function ngobHat(cx,cy){
  ctx.fillStyle="#d2ad60";ctx.beginPath();ctx.ellipse(cx,cy,10,3.4,0,0,7);ctx.fill(); // wide brim
  ctx.fillStyle="rgba(90,66,30,.35)";ctx.beginPath();ctx.ellipse(cx,cy+0.6,10,3.4,0,0,Math.PI);ctx.fill(); // brim underside
  ctx.fillStyle="#e2c074";ctx.beginPath();ctx.moveTo(cx-6,cy);ctx.quadraticCurveTo(cx,cy-9,cx+6,cy);ctx.closePath();ctx.fill(); // cone dome
  ctx.strokeStyle="rgba(120,88,38,.5)";ctx.lineWidth=0.8;
  ctx.beginPath();ctx.moveTo(cx-5,cy-1);ctx.lineTo(cx,cy-7);ctx.moveTo(cx+5,cy-1);ctx.lineTo(cx,cy-7);ctx.stroke();
}
function rplayer(x,y){
  const p=G.player;
  const swingT = p.atkT>0 ? 1-p.atkT/0.22 : (p.hitT>0 ? 1-p.hitT/0.16 : -1);
  const acting = swingT>=0;
  const ph=p.walk||0, amt=p.moveAmt||0;
  const legSw=Math.sin(ph)*5*amt;      // legs swing along facing
  const armSw=Math.sin(ph)*4*amt;
  const bob=-Math.abs(Math.sin(ph))*2*amt; // vertical bob while walking
  ctx.save();ctx.translate(x,y);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(0,12,11+amt*1.5,4,0,0,7);ctx.fill();
  ctx.save();ctx.scale(p.dir,1);   // face left/right
  ctx.translate(0,bob);
  const hasBody=!!G.equip.body, hasHead=!!G.equip.head, hasFeet=!!G.equip.feet, hasBack=!!G.equip.back;
  const skin="#e8c39a";
  const shirt=p.dmgT>0?"#ff7a6a":(hasBody?"#8a6a3a":"#2f4a6b");   // ม่อฮ่อม indigo (no armor) / leather brown
  const pants=hasFeet?"#5a4326":"#3a4a63";                         // boots tint legs
  const pack="#6e4f2c";
  // ---- legs (behind body) ----
  ctx.fillStyle=pants;
  ctx.beginPath();ctx.ellipse(-3+legSw,9,3,4.5,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(3-legSw,9,3,4.5,0,0,7);ctx.fill();
  // ---- backpack (only if wearing one) ----
  if(hasBack){ctx.fillStyle=pack;ctx.beginPath();ctx.ellipse(-6,0,5,7,0,0,7);ctx.fill();
    ctx.strokeStyle="#4a3318";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-6,-5);ctx.lineTo(-6,5);ctx.stroke();}
  // ---- back arm ----
  let backArm = acting? -0.2 : armSw;
  ctx.strokeStyle=shirt;ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-2,-1);ctx.lineTo(-4,6+backArm);ctx.stroke();
  // ---- torso ----
  ctx.fillStyle=shirt;ctx.beginPath();ctx.ellipse(0,1,8,9,0,0,7);ctx.fill();
  if(hasBody){ // armor plate highlights
    ctx.strokeStyle="rgba(0,0,0,.25)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-5,-2);ctx.lineTo(5,-2);ctx.stroke();
    ctx.fillStyle="rgba(255,255,255,.12)";ctx.beginPath();ctx.ellipse(-2,-2,3,4,0,0,7);ctx.fill();}
  // ---- head ----
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(2,-8,6.5,0,7);ctx.fill();
  if(hasHead){ // helmet replaces hat
    ctx.fillStyle="#6e4f2c";ctx.beginPath();ctx.arc(2,-9,7,Math.PI*1.02,Math.PI*1.98);ctx.fill();
    ctx.fillStyle="#4a3318";ctx.fillRect(-5,-9,14,2);
    ctx.fillStyle="#241a14";ctx.beginPath();ctx.arc(6,-8,1.2,0,7);ctx.fill();
  }else{ // หมวกงอบ + eye below the brim
    ngobHat(2,-11);
    ctx.fillStyle="#241a14";ctx.beginPath();ctx.arc(6,-6.5,1.2,0,7);ctx.fill();
  }
  // ---- front arm + held tool ----
  const held=heldVisual();
  const sw = acting? Math.sin(swingT*Math.PI) : 0;
  ctx.save();
  ctx.translate(6,2); // shoulder/hand pivot, front side
  if(held){
    ctx.strokeStyle=shirt;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(2,2);ctx.stroke();
    drawTool(ctx,held,sw,headColor(G.equip.hand&&G.equip.hand.id));
  }else{
    // bare front arm swings with walk / punches on action
    const fa = acting? sw*8 : -armSw;
    ctx.strokeStyle=shirt;ctx.beginPath();ctx.moveTo(-4,-3);ctx.lineTo(4+fa,4);ctx.stroke();
  }
  ctx.restore();
  ctx.restore(); // un-scale
  // action arc flourish (drawn unscaled so it reads in world space toward facing)
  if(acting){
    ctx.strokeStyle=p.atkT>0?"rgba(196,69,47,.7)":"rgba(224,150,46,.6)";
    ctx.lineWidth=3;ctx.beginPath();
    ctx.arc(10*p.dir,0,18, (-0.7+swingT*1.2)*p.dir, (0.3+swingT*1.2)*p.dir, p.dir<0);
    ctx.stroke();
  }
  ctx.restore();
}

                          :(near?`🗑️ กด <b>รื้อ</b> เพื่อรื้อถอน`:`โหมดรื้อ — เดินไปใกล้สิ่งปลูกสร้าง`);}
  else if(G.buildMode)pr=`กำลังวาง <b>${ITEMS[G.buildMode].nm}</b> — กด "วาง"`;
  else{const l=nearestLoot();const n=nearestNode();const box=nearestStation("box");const fur=nearestStation("furnace");const wf=nearestWolf();const ex=nearestExtract();
    if(wf)pr=`หมาป่าใกล้ — กด <b>ตี</b>`;
    else if(l)pr=`${l.corpse?"💀 ศพ":"🎒 ของ"} — กด <b>เก็บ</b>`;
    else if(box)pr=`กล่องเก็บของ — กด <b>เก็บ</b> เพื่อฝาก`;
    else if(fur)pr=`เตาหลอม — กด <b>เก็บ</b> เพื่อหลอม/ปรุง`;
    else if(n){const t2=NODE_TYPES[n.type];const need=t2.tool&&!handToolPower(t2.tool)&&!G.inv.some(s=>ITEMS[s.id].tool===t2.tool);pr=need?`ต้องมี${t2.tool==="pick"?"อีเต้อ":"ขวาน"}ก่อน`:`${t2.ic} กด <b>เก็บ</b>`;}
    else if(ex&&G.round.active)pr=ex.arming?`⏏ กำลังสกัด...`:`⏏ <b>${ex.nm}</b> — กด <b>สกัด</b>`;
  }
  const pe=$("prompt");if(pr){pe.innerHTML=pr;pe.classList.add("on");}else pe.classList.remove("on");
  // action button label
  const ex2=nearestExtract();
  $("a-act").textContent=G.editMode?(G.editMode==="move"?"ยก":"รื้อ"):G.buildMode?"วาง":(ex2&&G.round.active&&!nearestNode()&&!nearestLoot()&&!nearestStation("box")&&!nearestStation("furnace"))?"สกัด":"เก็บ";
  // beacon action button (pick up crate / plant / relocate)
  const bb=$("a-beacon");const b=G.beacon;
  const beaconMine=(window.NET&&NET.connected)?(b.owner===NET.id):(b.owner==="player");
  if(b.state==="crate"&&dist2(b.x,b.y,p.x,p.y)<100*100){bb.style.display="flex";bb.textContent="เก็บ📡";}
  else if(b.state==="carried"&&beaconMine){bb.style.display="flex";bb.textContent="ปัก📡";}
  else if(b.state==="planted"&&beaconMine&&dist2(b.x,b.y,p.x,p.y)<60*60){bb.style.display="flex";bb.textContent="ยก📡";}
  else if(b.state==="planted"&&!beaconMine&&dist2(b.x,b.y,p.x,p.y)<54*54){bb.style.display="flex";bb.textContent="ทุบ📡";}
  else bb.style.display="none";
  // weapon swap button (when you own both a melee and a ranged weapon)
  const sw=$("a-swap");const hh=G.equip.hand?ITEMS[G.equip.hand.id]:null;
  const hasRanged=(hh&&hh.ranged)||G.inv.some(s=>ITEMS[s.id].ranged);
  const hasMelee=(hh&&hh.weapon&&!hh.ranged)||G.inv.some(s=>{const d=ITEMS[s.id];return d.weapon&&!d.ranged;});
  if(hasRanged&&hasMelee){sw.style.display="flex";sw.textContent=(hh&&hh.ranged)?"⇄ใกล้":"⇄ไกล";}
  else sw.style.display="none";
  // reload button (only when holding a gun)
  const rb=$("a-reload");const hd=handDef();
  if(hd&&hd.gun){const h=G.equip.hand;rb.style.display="flex";
    rb.textContent=p.reloadT>0?"…":`⟳ ${h.loaded||0}/${invCount("bullet")}`;}
  else rb.style.display="none";
  // mount button (near a horse w/ saddle, or while mounted)
  const mb=$("a-mount");
  if(G.mounted){mb.style.display="flex";mb.textContent="ลงม้า";}
  else if(invCount("saddle")>0&&nearestHorse()){mb.style.display="flex";mb.textContent="ขึ้นม้า";}
  else mb.style.display="none";
  drawMini();drawHotbar();drawBuffs();
  if(G.mapOpen)drawFullMap();
}

/* ---------- screens ---------- */
function show(id){$(id).classList.remove("off");}
function hide(id){$(id).classList.add("off");}
function fmtItems(items){
  if(!items||!items.length)return '<div style="opacity:.45;font-size:11px;margin:4px 0">— ไม่มี —</div>';
  return '<div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:5px 0">'+
    items.map(it=>`<span style="background:#15130e;border:1px solid #38332a;border-radius:5px;padding:3px 6px;font-size:11px">${ITEMS[it.id].ic} ${ITEMS[it.id].nm} ×${it.n}</span>`).join("")+'</div>';
}
function statRow(e){
  const mm=Math.floor(e.survived/60),ss=String(e.survived%60).padStart(2,"0");
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:11px;margin:8px auto;max-width:280px;text-align:left;opacity:.9">
    <span>⏱️ เวลา</span><span style="text-align:right">${mm}:${ss}</span>
    <span>⛏️ เก็บทรัพยากร</span><span style="text-align:right">${e.gathered} ชิ้น (${e.harvests} จุด)</span>
    <span>🗡️ ฆ่าหมาป่า</span><span style="text-align:right">${e.kills} ตัว</span>
    <span>🩸 โดนกัด</span><span style="text-align:right">${e.hits} ครั้ง</span>
  </div>`;
}
function showSummary(e){
  let head,body;
  if(e.kind==="win"){
    head=`<h1 style="color:var(--good)">หนีออกจากเกาะสำเร็จ! 🚁</h1>
      <p>คุณยึดตัวส่งสัญญาณไว้ได้จนเฮลิคอปเตอร์มารับ — <b style="color:var(--good)">ผู้รอดชีวิต!</b><br>
         รวมของที่แบก + โบนัสชัยชนะ = <b style="color:var(--good)">${e.val}</b> มูลค่า</p>`;
    body=`<div style="font-size:11px;opacity:.7;margin-top:8px">ของที่เอาออกมาได้</div>${fmtItems(e.gained)}`;
  }else if(e.kind==="extract"){
    head=`<h1 style="color:var(--good)">สกัดสำเร็จ ⏏</h1>
      <p>ถอยออกมาพร้อมของ (ยังไม่ชนะรอบ แต่เก็บของไว้ต่อยอด) ได้ <b style="color:var(--good)">${e.val}</b> มูลค่า</p>`;
    body=`<div style="font-size:11px;opacity:.7;margin-top:8px">ของที่เอากลับมา</div>${fmtItems(e.gained)}`;
  }else{
    let why;
    if(e.kind==="botwin")why=`${e.winner||"ผู้รอดชีวิตอื่น"} ยึดสัญญาณแล้วหนีออกเกาะไปก่อน — คุณตกค้างตอนเกาะระเบิด`;
    else if(e.kind==="timeout")why="เกาะระเบิด — ไม่มีใครยึดสัญญาณไว้ทัน";
    else why="ตายบนเกาะ";
    const ttl=e.kind==="botwin"?"แพ้ — คนอื่นหนีไปก่อน 🚁":e.kind==="timeout"?"เกาะระเบิด 💥":"ตายแล้ว 💀";
    head=`<h1 class="dead">${ttl}</h1>
      <p>${why} — ของที่แบกตกหมด เสีย <b style="color:var(--danger)">${e.lostVal}</b> มูลค่า<br>
         💀 ลงเกาะรอบหน้ารีบไปเก็บคืนได้ ถ้ายังไม่หาย</p>`;
    body=`<div style="font-size:11px;opacity:.7;margin-top:8px">ของที่เสียไป</div>${fmtItems(e.lost)}`;
  }
  $("cover-box").innerHTML=head+statRow(e)+body+`
    <div class="stat" style="margin-top:10px">ปลอดภัยในฐาน <b>${G.banked}</b> · สูงสุด/รอบ <b>${G.bestRun}</b></div>
    <div style="margin:16px 0"><button onclick="deploy()">ลงเกาะอีกครั้ง</button>
      <button onclick="showStart()" style="background:#cdbfa3;margin-left:8px">ฐาน / ประวัติ</button></div>
    <div style="font-size:10px;opacity:.55">เคล็ดลับ: ฝากของแพงเข้ากล่อง หรือสกัดเร็ว ดีกว่าโลภจนหมดเวลา</div>`;
  show("cover");
}
function historyBlock(){
  if(!G.history.length)return "";
  const ext=G.history.filter(h=>h.kind==="extract"||h.kind==="win");
  const wins=G.history.filter(h=>h.kind==="win").length;
  const totalExt=ext.reduce((a,b)=>a+b.val,0);
  const avg=ext.length?Math.round(totalExt/ext.length):0;
  const rows=G.history.slice(0,10).map(h=>{
    const mm=Math.floor(h.survived/60),ss=String(h.survived%60).padStart(2,"0");
    const ic=h.kind==="win"?"🏆":h.kind==="extract"?"🟢":h.kind==="timeout"?"🟠":"🔴";
    const v=(h.kind==="extract"||h.kind==="win")?`+${h.val}`:`-${h.lostVal}`;
    const vc=(h.kind==="extract"||h.kind==="win")?"var(--good)":"var(--danger)";
    return `<div style="display:flex;justify-content:space-between;font-size:10px;padding:2px 0;border-bottom:1px solid #2a2620">
      <span>${ic} ${mm}:${ss} · ⛏️${h.gathered} 🗡️${h.kills}</span><span style="color:${vc};font-weight:700">${v}</span></div>`;
  }).join("");
  return `<div style="margin:14px auto 0;max-width:300px;text-align:left">
      <div style="font-family:var(--disp);font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.8;margin-bottom:4px">ประวัติ 10 รอบล่าสุด</div>
      <div style="display:flex;gap:12px;font-size:10px;opacity:.85;margin-bottom:5px">
        <span>🏆 ชนะ <b>${wins}</b></span><span>ออกได้ <b>${ext.length}</b></span><span>รวม <b>${totalExt}</b></span></div>
      ${rows}</div>`;
}
function showStart(){
  const banked=G.banked, hasBase=!!G.core;
  if(!G.playerName)G.playerName="ผู้รอดชีวิต#"+(1000+Math.floor(Math.random()*9000));
  const s=slotInfo();
  $("cover-box").innerHTML=`
    <h1>Last Short Island</h1>
    <div style="font-size:11px;color:var(--good);margin:-4px 0 6px">🌐 เซิร์ฟเวอร์ออนไลน์ · รีเซ็ตทุก 30 นาที · รอบนี้เหลือ <b>${fmtClock(s.remain)}</b></div>
    <div style="font-size:11px;opacity:.85;margin-bottom:6px">ชื่อคุณ: <b style="color:var(--amber)">${G.playerName}</b>
       <span class="danger-link" style="font-size:10px" onclick="renamePlayer()">เปลี่ยนชื่อ</span></div>
    <div style="font-size:11px;opacity:.85;margin-bottom:8px">สกิน:
       ${SKINS.map((sk,i)=>`<span onclick="setSkin(${i})" style="display:inline-block;cursor:pointer;margin:0 2px;padding:2px 7px;border-radius:10px;border:1px solid ${i===(G.skin||0)?'var(--amber)':'#3a342a'};background:${i===(G.skin||0)?'rgba(224,150,46,.18)':'transparent'}"><b style="color:${sk.shirt}">●</b> ${sk.nm}</span>`).join("")}</div>
    <p style="font-size:12px">เกาะนี้จะ <b style="color:var(--danger)">ระเบิดเมื่อหมดรอบ</b> — คุณกับผู้รอดชีวิตอื่น
       เตรียมตัว เก็บของ สร้างป้อม คราฟต์อาวุธ<br>
       ช่วงท้าย <b style="color:var(--amber)">📡 Airdrop</b> ตกกลางเกาะ — แย่ง <b>ตัวส่งสัญญาณ</b>
       ปักไว้แล้วป้องกันจนเครื่องมารับ = <b style="color:var(--good)">หนีออกจากเกาะได้ ชนะ!</b></p>
    ${banked?`<div class="stat">ฝากปลอดภัยในฐาน <b>${banked}</b> · สูงสุด/รอบ <b>${G.bestRun}</b></div>`:""}
    <div style="font-size:10px;opacity:.7;margin:6px auto;max-width:300px;text-align:left;line-height:1.5">
      🛠️ <b>เตรียมตัว</b> — ขุด/คราฟต์/สร้างป้อม ตุนกระสุน<br>
      📡 <b>Airdrop</b> ตกกลางเกาะช่วงท้าย — แย่งกับผู้รอดชีวิตอื่น 3 คน<br>
      🛡️ <b>ปัก+ป้องกัน</b> beacon จากมอนสเตอร์+คู่แข่ง จนหมดเวลา = ชนะ<br>
      ⏏ หรือถอยที่ <b>จุดสกัด</b> เพื่อเก็บของไว้รอบหน้า (ไม่ชนะ แต่ไม่เสียของ)</div>
    <div style="margin:14px 0"><button onclick="deploy()">เข้าเซิร์ฟเวอร์ (เหลือ ${fmtClock(s.remain)})</button></div>
    <div id="board" style="font-size:10px;opacity:.7;margin:4px 0">กำลังโหลดกระดานผู้ชนะ...</div>
    ${historyBlock()}
    <div style="font-size:10px;opacity:.55;line-height:1.7;margin-top:12px">
      มือถือ: สติ๊กซ้ายเดิน · ปุ่มขวา <b>เก็บ/สกัด/ตี</b> · ปุ่มล่าง <b>ของ/คราฟต์/สร้าง</b><br>
      <span class="kbd">คอม: WASD · E เก็บ/สกัด · Space ตี · F กิน · I/C/B เมนู</span><br>
      <span style="opacity:.7">Last Short Island · v1.5 · เกาะใหญ่ 2× + ไบโอมใหม่ · เล่นได้ทั้งบน Claude และเว็บ</span></div>
    ${banked||hasBase||G.history.length?'<div class="reset"><span class="danger-link" onclick="hardReset();showStart()">⟲ เริ่มใหม่หมด (ล้าง save)</span></div>':""}`;
  show("cover");
  renderBoard();
}
window.SKINS=[
  {nm:"ชาวนา", shirt:"#294d61", pant:"#2b2a28"},
  {nm:"ชาวเล",  shirt:"#2f6b63", pant:"#26302e"},
  {nm:"พราน",   shirt:"#4f6b3a", pant:"#2e2a1e"},
  {nm:"นักรบ",  shirt:"#7a2f3a", pant:"#2a2024"},
];
function setSkin(i){G.skin=((i%SKINS.length)+SKINS.length)%SKINS.length;save();showStart();}
function renamePlayer(){const n=prompt("ตั้งชื่อผู้รอดชีวิต:",G.playerName);if(n&&n.trim()){G.playerName=n.trim().slice(0,16);showStart();}}
async function renderBoard(){
  const list=await loadBoard();const el=$("board");if(!el)return;
  if(!list.length){el.innerHTML="🏆 ยังไม่มีผู้รอดชีวิตในเซิร์ฟเวอร์ — เป็นคนแรกสิ!";return;}
  const rows=list.slice(0,6).map((w,i)=>`<div style="display:flex;justify-content:space-between"><span>${["🥇","🥈","🥉"][i]||"🏅"} ${w.name}</span><span style="color:var(--good)">${w.val}</span></div>`).join("");
  el.innerHTML=`<div style="font-family:var(--disp);letter-spacing:1px;text-transform:uppercase;opacity:.8;margin-bottom:3px">🏆 ผู้รอดชีวิตล่าสุดในเซิร์ฟเวอร์</div><div style="max-width:280px;margin:0 auto;text-align:left">${rows}</div>`;
}

/* ---------- main loop ---------- */
let last=0;
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000)||0;last=t;
  update(dt);draw();updateHUD();
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
async function boot(){
  resize();await load();await loadHistory();
  try{const sp=await store.get("lsi:snd",false);if(sp==="0")SND.on=false;}catch(e){}
  try{const mp=await store.get("lsi:mus",false);if(mp==="0")MUS.on=false;}catch(e){}
  const sb=document.getElementById("snd");if(sb)sb.textContent=SND.on?"🔊":"🔇";
  const mb=document.getElementById("mus");if(mb)mb.textContent=MUS.on?"🎵":"🎶̶";
  buildWorld();setupInput();
  // place player at base if core exists
  if(G.core){G.player.x=G.core.x;G.player.y=G.core.y+50;}
  G.paused=true;            // freeze until Start pressed
  showStart();
  requestAnimationFrame(loop);
  // periodic autosave
  setInterval(()=>{if(!G.dead)save();},15000);
}
boot();
</script>
